# A string used to distinguish different Supabase projects on the same host.
project_id = "sincvete"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

[remotes.staging]
project_id = "owmcrqvnfubyjxrlyhlc"

[remotes.staging.auth]
site_url = "https://sync-vete-staging-guillermo-c-bmw.vercel.app"
additional_redirect_urls = [
  "https://sync-vete-staging-guillermo-c-bmw.vercel.app/**",
  "https://sync-vete-staging-*-guillermo-c-bmw.vercel.app/**",
  "https://*-guillermo-c-bmw.vercel.app/**",
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/actualizar-contrasena"
]
minimum_password_length = 6

[remotes.staging.db]
major_version = 17

[remotes.staging.auth.email]
double_confirm_changes = false
max_frequency = "1m0s"
otp_length = 8

[remotes.staging.db.pooler]
default_pool_size = 15
max_client_conn = 200

[remotes.staging.storage.analytics]
enabled = true
max_namespaces = 10

[remotes.staging.storage.image_transformation]
enabled = true

[remotes.staging.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
